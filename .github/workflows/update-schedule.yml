name: Update schedule.txt

on:
  repository_dispatch:
    types: [update-schedule]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update schedule.txt
        env:
          SCHEDULE: ${{ github.event.client_payload.schedule }}
        run: |
          printf '%s\n' "$SCHEDULE" > schedule.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update schedule.txt"
          git push
